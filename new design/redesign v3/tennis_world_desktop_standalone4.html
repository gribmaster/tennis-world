<title>Tennis World — Desktop Design</title>

<style>
:root {
  --ink: #0F0F0F;
  --graphite: #2A2A2A;
  --stone: #6B6B6B;
  --mist: #B8B8B6;
  --bone: #F5F2EC;
  --ivory: #FAF8F3;
  --clay: #B95C3A;
  --moss: #4A5D3F;
  --gold: #B89968;
  --paper: #FFFFFF;
  --shadow: rgba(15,15,15,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:#E8E4DC;}
body{font-family:'Inter',-apple-system,sans-serif;color:var(--ink);background:#E8E4DC;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 24px 64px;}

/* Typography */
.serif{font-family:'Cormorant Garamond',Georgia,serif;}

/* Browser frame (desktop canvas, mirrors the phone shell's conceit) */
.browser-frame{width:100%;max-width:1400px;background:var(--ivory);border-radius:16px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,0.28),0 0 0 1px rgba(255,255,255,0.12);flex-shrink:0;}
.browser-topbar{height:48px;background:var(--paper);border-bottom:1px solid rgba(184,184,182,0.3);display:flex;align-items:center;padding:0 18px;gap:14px;flex-shrink:0;}
.browser-dots{display:flex;gap:7px;}
.browser-dot{width:11px;height:11px;border-radius:50%;}
.browser-url{flex:1;max-width:480px;margin:0 auto;background:var(--bone);border-radius:100px;padding:7px 18px;font-size:12px;color:var(--stone);text-align:center;letter-spacing:0.01em;}
.browser-frame-inner{height:860px;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:smooth;}
.browser-frame-inner::-webkit-scrollbar{width:10px;}
.browser-frame-inner::-webkit-scrollbar-thumb{background:rgba(184,184,182,0.5);border-radius:6px;}

/* Site nav */

/* Image overlays */
.img-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,0.72) 100%);}

/* Fade in */
.fade-in{animation:fadeIn 300ms ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Lock overlay */
.lock-overlay{position:absolute;inset:0;backdrop-filter:blur(16px);background:rgba(245,242,236,0.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:inherit;}

/* Search bar */
.search-bar{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:100px;padding:0 18px;height:50px;box-shadow:0 2px 12px rgba(15,15,15,0.1);}
.search-input{flex:1;border:none;outline:none;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);background:transparent;}
.search-input::placeholder{color:var(--stone);}

/* Label chips */
.label-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:100px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent;}
.chip-surface-clay{background:#F0E6E0;color:#8B3A1F;border-color:#D4A090;}
.chip-surface-hard{background:#E0E8F0;color:#1A4A70;border-color:#90B0C8;}
.chip-surface-grass{background:#E4EDE0;color:#2A5020;border-color:#90B878;}
.chip-surface-carpet{background:#EDE8E0;color:#504030;border-color:#B0A888;}
.chip-exp{background:rgba(15,15,15,0.06);color:var(--graphite);border-color:transparent;}
.chip-access-private{background:#F5F0E8;color:#6B4A20;border-color:#C8A878;}
.chip-access-open{background:#E8F5E8;color:#2A5020;border-color:#78B878;}
.chip-filter{background:var(--paper);color:var(--ink);border-color:rgba(15,15,15,0.15);cursor:pointer;}
.chip-filter.active{background:var(--ink);color:var(--bone);border-color:var(--ink);}

/* Premium badge */
.premium-badge{background:linear-gradient(135deg,#C8A860,#B89968);color:var(--paper);padding:3px 10px;border-radius:100px;font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:4px;}

/* Map styles */
.map-bg{
  background:
    linear-gradient(160deg,#C8D4C0 0%,#B8C8B0 50%,#A8B8A0 100%),
    radial-gradient(ellipse 60% 40% at 60% 45%,#A0B8C8 0%,transparent 60%);
  position:relative;overflow:hidden;
}
.map-pin-circle{background:var(--paper);border:2px solid var(--ink);border-radius:100px;font-size:12px;font-weight:600;color:var(--ink);padding:5px 12px;box-shadow:0 2px 8px rgba(0,0,0,0.2);white-space:nowrap;}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:0.04em;transition:opacity 150ms;}
.btn:hover{opacity:0.88;}
.btn:active{opacity:0.75;}
.btn-primary{background:var(--ink);color:var(--bone);border-radius:4px;height:52px;padding:0 28px;font-size:13px;text-transform:uppercase;letter-spacing:0.1em;}
.btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:4px;height:44px;padding:0 22px;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;}
.btn-gold{background:var(--gold);color:var(--paper);border-radius:4px;height:52px;padding:0 28px;font-size:13px;text-transform:uppercase;letter-spacing:0.1em;}
.btn-sm{height:40px;padding:0 18px;font-size:11.5px;}

/* Feature icon */
.feature-icon{width:40px;height:40px;border-radius:50%;background:var(--bone);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* Divider / section header / pill button (ported from mobile) */
.divider{height:1px;background:rgba(184,184,182,0.3);}
.sec-hdr{display:flex;align-items:baseline;justify-content:space-between;}
.sec-hdr .view-all{font-size:13px;color:var(--stone);cursor:pointer;}
.btn-pill{border-radius:100px;}

/* h-scroll (unused on desktop grids but kept for parity) */
.h-scroll{display:flex;overflow-x:auto;gap:12px;scrollbar-width:none;padding-bottom:2px;}
.h-scroll::-webkit-scrollbar{display:none;}
</style>
</head>

// ─── Label chip component ──────────────────────────────────
function Label({type, children, small}){
  const cl = type==='clay'?'chip-surface-clay':type==='hard'?'chip-surface-hard':type==='grass'?'chip-surface-grass':type==='carpet'?'chip-surface-carpet':type==='private'?'chip-access-private':type==='open'?'chip-access-open':'chip-exp';
  return <span className={`label-chip ${cl}`} style={{fontSize:small?10:12,padding:small?'3px 8px':'5px 10px'}}>{children}</span>;
}
function SurfaceLabel({surface,small}){
  return <Label type={surface.toLowerCase()} small={small}>{surface}</Label>;
}

// ─── Court card — ported one-to-one from the mobile prototype's shared CourtCard ───
function CourtCard({court, onClick, locked, saved, onToggleSave, saveDisabled}){
  const [tipOpen,setTipOpen] = useState(false);
  return(
    <div onClick={onClick} style={{position:'relative',borderRadius:14,overflow:'hidden',cursor:'pointer',height:340}}>
      <img src={court.img} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>
      <div className="img-overlay"/>
      <div style={{position:'absolute',top:12,left:12,display:'flex',gap:6}}>
        {locked
          ? <span className="premium-badge" style={{fontSize:9}}>{Ico.lock(9)} Premium</span>
          : <SurfaceLabel surface={court.surface} small/>
        }
      </div>
      {onToggleSave&&(
        <div style={{position:'absolute',top:12,right:12}}>
          <button onClick={e=>{e.stopPropagation(); if(saveDisabled){ setTipOpen(o=>!o); return; } onToggleSave();}} style={{width:34,height:34,borderRadius:'50%',background:'rgba(15,15,15,0.45)',backdropFilter:'blur(8px)',border:'none',cursor:saveDisabled?'not-allowed':'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:saveDisabled?'rgba(245,242,236,0.5)':(saved?'#E85D4A':'var(--bone)')}}>
            {Ico.save(15)}
          </button>
          {saveDisabled&&tipOpen&&(
            <div style={{position:'absolute',top:'115%',right:0,background:'var(--ink)',color:'var(--bone)',fontSize:11,fontWeight:500,padding:'6px 10px',borderRadius:6,whiteSpace:'nowrap',boxShadow:'0 6px 16px rgba(0,0,0,0.25)',zIndex:20}}>
              Sign in to save
            </div>

        </div>
      )}
      <div style={{position:'absolute',bottom:0,left:0,right:0,padding:'18px 16px 16px'}}>
        <div className="serif" style={{fontSize:21,fontWeight:400,color:'#fff',lineHeight:1.2,marginBottom:5}}>{locked?'Premium Court':court.name}</div>
        <div style={{display:'flex',gap:5,alignItems:'center',marginBottom:9,color:'rgba(255,255,255,0.85)'}}>
          {Ico.pin(11)}<span style={{fontSize:12}}>{locked?'Unlock to reveal location':court.location}</span>

}

      <div style={{fontSize:13,fontWeight:500,color:'var(--stone)',marginBottom:16}}>{tab==='courts'?saved.size:savedCollectionList.length} saved</div>

      {tab==='courts'&&(
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:20}}>

  ];
  const name = 'Janet Sée';
  const avatar = U(IMG.hero1,200);

  if(isGuest){
    return <AuthGateScreen onNav={onNav} onSignIn={onSignIn}/>;
  }

  return(
    <div style={{padding:'44px 56px 80px',background:'var(--ivory)'}}>
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:12,maxWidth:1120,margin:'0 auto 12px'}}>
        <button onClick={()=>onNav('settings')} style={{width:38,height:38,borderRadius:'50%',background:'var(--paper)',border:'1px solid rgba(184,184,182,0.4)',cursor:'pointer',color:'var(--graphite)',display:'flex',alignItems:'center',justifyContent:'center'}}>{Ico.settings(17)}</button>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'320px 1fr',gap:48,alignItems:'start',maxWidth:1120,margin:'0 auto'}}>
        {/* Left column */}
        <div>
          <div style={{display:'flex',flexDirection:'column',alignItems:'flex-start',gap:14}}>
            <div style={{width:96,height:96,borderRadius:'50%',overflow:'hidden',border:'3px solid var(--paper)',boxShadow:'0 2px 12px rgba(15,15,15,0.15)'}}>
              <img src={avatar} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
            </div>
            <div>
              <div className="serif" style={{fontSize:28,fontWeight:400}}>{name}</div>
              <button className="btn btn-secondary btn-sm btn-pill" style={{marginTop:10,gap:6}}>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                Edit profile
              </button>
            </div>
          </div>

          {/* Stats */}
          <div style={{display:'flex',marginTop:28,background:'var(--paper)',borderRadius:14,padding:'18px 0'}}>
            {stats.map((s,i)=>(
              <div key={s.label} onClick={s.active?()=>onNav('saved'):undefined} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',borderRight:i<stats.length-1?'1px solid rgba(184,184,182,0.3)':'none',opacity:s.active?1:0.45,cursor:s.active?'pointer':'default'}}>
                <div style={{color:'var(--ink)'}}>{s.icon(15)}</div>
                <div style={{margin:'6px 0'}}>{s.active?<span style={{fontSize:20,fontWeight:700}}>{s.n}</span>:<span style={{fontSize:9,fontWeight:600,letterSpacing:'0.05em',textTransform:'uppercase',color:'var(--stone)'}}>Soon</span>}</div>
                <div style={{fontSize:11,color:'var(--stone)'}}>{s.label}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Right column */}
        <div>
          {/* Membership */}
          {!unlocked?(
            <div style={{background:'var(--ink)',borderRadius:14,padding:'22px 24px',display:'flex',gap:16,alignItems:'center'}}>
              <div style={{flex:1}}>
                <div style={{fontSize:11,color:'var(--gold)',fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:5}}>Membership</div>
                <div className="serif" style={{fontSize:24,color:'var(--bone)',fontWeight:300}}>The world, unlocked.</div>
                <div style={{fontSize:13,color:'rgba(245,242,236,0.6)',marginTop:5}}>One-time · Lifetime · $29</div>
              </div>
              <button className="btn btn-gold btn-sm" onClick={onUnlock}>Unlock →</button>
            </div>
          ):(
            <div style={{background:'linear-gradient(135deg,#1A1A1A,#2A2A2A)',borderRadius:14,padding:'18px 24px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div>
                <div style={{fontSize:11,color:'var(--gold)',fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase'}}>Lifetime Member</div>
                <div style={{fontSize:14,color:'var(--bone)',marginTop:3}}>Full atlas access · Since 2024</div>
              </div>
              <span className="premium-badge">✦ Active</span>
            </div>
          )}

          {/* My collections */}
          <div style={{marginTop:36}}>
            <div className="sec-hdr" style={{marginBottom:16,cursor:'pointer'}} onClick={()=>onNav('saved')}>
              <span style={{fontSize:17,fontWeight:600}}>My collections</span>
              <span className="view-all">View all →</span>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:16}}>
              {COLLECTIONS.slice(0,4).map(c=>(
                <div key={c.id} onClick={()=>onNav('saved')} style={{width:'100%',height:180,position:'relative',borderRadius:14,overflow:'hidden',cursor:'pointer'}}>
                  <img src={c.img} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                  <div className="img-overlay"/>
                  <div style={{position:'absolute',top:10,left:10}}><span style={{background:'rgba(15,15,15,0.5)',backdropFilter:'blur(8px)',padding:'3px 10px',borderRadius:100,fontSize:10,color:'#fff',fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase'}}>{c.courts} COURTS</span></div>
                  <div style={{position:'absolute',bottom:0,left:0,right:0,padding:'14px 16px'}}><div className="serif" style={{fontSize:19,fontWeight:400,color:'#fff'}}>{c.name}</div></div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Settings screen (desktop) ──────────────────────────────
function SettingsScreen({onBack, unlocked}){
  return(
    <div style={{padding:'44px 56px 80px',background:'var(--ivory)',display:'flex',justifyContent:'center'}}>
      <div style={{width:480}}>
        <span onClick={onBack} style={{fontSize:13,color:'var(--stone)',cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6,marginBottom:20}}>{Ico.back(13)} Back to Profile</span>
        <div className="serif" style={{fontSize:34,fontWeight:400,marginBottom:24}}>Settings</div>
        <div style={{background:'var(--paper)',borderRadius:14,overflow:'hidden'}}>
          {[
            {label:'Subscription & Access',sub:unlocked?'Lifetime member — active':'Free plan'},
            {label:'Account settings',sub:null},
            {label:'Contact us',sub:null},
          ].map((item,i,arr)=>(
            <div key={item.label}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'16px 20px',cursor:'pointer'}}>
                <div>
                  <div style={{fontSize:14,fontWeight:400}}>{item.label}</div>
                  {item.sub&&<div style={{fontSize:11,color:'var(--stone)',marginTop:2}}>{item.sub}</div>}
                </div>
                <span style={{color:'var(--stone)'}}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" width="14" height="14"><polyline points="9 18 15 12 9 6"/></svg></span>
              </div>
              {i<arr.length-1&&<div className="divider" style={{margin:0}}/>}
            </div>
          ))}
        </div>
        <div style={{display:'flex',gap:18,marginTop:18,justifyContent:'center'}}>
          {['Privacy Policy','Terms of Service'].map(l=>(<span key={l} style={{fontSize:12,color:'var(--stone)',cursor:'pointer',textDecoration:'underline'}}>{l}</span>))}
        </div>
      </div>
    </div>
  );
}

// ─── Purchase Success / Failed screens (desktop) ────────────
function PurchaseSuccessScreen({onBack}){
  return(
    <div style={{padding:'64px 56px 80px',background:'var(--ivory)',display:'flex',justifyContent:'center'}}>
      <div style={{width:520,textAlign:'center'}}>
        <div style={{width:60,height:60,borderRadius:'50%',border:'1.5px solid var(--gold)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--gold)',margin:'0 auto 22px'}}>{Ico.check(26)}</div>
        <div style={{fontSize:11,fontWeight:600,letterSpacing:'0.12em',color:'var(--gold)',textTransform:'uppercase',marginBottom:10}}>WELCOME TO</div>
        <div className="serif" style={{fontSize:48,fontWeight:300}}>Tennis World</div>
        <p style={{fontSize:15,color:'var(--graphite)',marginTop:14}}>Your membership is now active.</p>
        <p style={{fontSize:13,color:'var(--stone)',lineHeight:1.6,marginTop:8}}>You now have full access to exact court locations, the complete atlas, and all curated collections across Tennis World.</p>

        <div style={{display:'flex',justifyContent:'center',gap:32,margin:'32px 0'}}>
          {[['120+','Countries'],['1800+','Courts'],['Exact','Locations'],['Curated','Collections']].map(([n,l])=>(
            <div key={l}><div style={{fontSize:20,color:'var(--ink)',fontWeight:600}}>{n}</div><div style={{fontSize:11,color:'var(--stone)',marginTop:2}}>{l}</div></div>
          ))}
        </div>

        <button className="btn btn-primary" style={{width:'100%',marginBottom:14}} onClick={onBack}>EXPLORE THE MAP →</button>
        <div style={{display:'flex',gap:12}}>
          <button className="btn btn-secondary" style={{flex:1,gap:6}}>{Ico.heart(13)} VIEW SAVED COURTS</button>
          <button className="btn btn-secondary" style={{flex:1,gap:6}}>{Ico.profile(13)} GO TO PROFILE</button>
        </div>
      </div>
    </div>
  );
}

function PurchaseFailedScreen({onBack, onRetry}){
  return(
    <div style={{padding:'64px 56px 80px',background:'var(--ivory)',display:'flex',justifyContent:'center'}}>
      <div style={{width:480,textAlign:'center'}}>
        <div style={{width:60,height:60,borderRadius:'50%',border:'1.5px solid #B95C3A',display:'flex',alignItems:'center',justifyContent:'center',color:'#B95C3A',margin:'0 auto 22px'}}>{Ico.close(26)}</div>
        <div className="serif" style={{fontSize:34,fontWeight:300}}>Payment unsuccessful</div>
        <p style={{fontSize:14,color:'var(--stone)',lineHeight:1.6,marginTop:12}}>Something went wrong with your payment. Your card hasn't been charged. Please try again or use a different payment method.</p>
        <div style={{background:'var(--paper)',borderRadius:12,padding:18,marginTop:24,marginBottom:26,border:'1px solid rgba(184,184,182,0.3)',textAlign:'left'}}>
          {['Card details not charged','Your courts still saved','Your progress not affected'].map((t,i,arr)=>(
            <div key={t} style={{display:'flex',gap:10,alignItems:'center',padding:'8px 0',borderBottom:i<arr.length-1?'1px solid rgba(184,184,182,0.2)':'none'}}>
              <div style={{width:20,height:20,borderRadius:'50%',background:'#E8F5E8',display:'flex',alignItems:'center',justifyContent:'center'}}>{Ico.check(11)}</div>
              <span style={{fontSize:13,color:'var(--graphite)'}}>{t}</span>
            </div>
          ))}
        </div>
        <button className="btn btn-primary" style={{width:'100%',marginBottom:12}} onClick={onRetry}>Try again</button>
        <button className="btn btn-secondary" style={{width:'100%',marginBottom:18}} onClick={onBack}>Go back</button>
        <div style={{fontSize:12,color:'var(--stone)'}}>Need help? <span style={{color:'var(--clay)',fontWeight:500,cursor:'pointer'}}>Contact support →</span></div>
      </div>
    </div>
  );
}

// ─── Demo app shell ──────────────────────────────────────────
function App(){
  const [screen,setScreen] = useState('home');
  const [prevScreen,setPrevScreen] = useState(null);
  const [openCourt,setOpenCourt] = useState(null);
  const [openCollection,setOpenCollection] = useState(null);
  const [accessState,setAccessState] = useState('guest'); // 'guest' | 'free' | 'full'
  const unlocked = accessState==='full';
  const isGuest = accessState==='guest';

  const navigate = (to) => { setPrevScreen(screen); setScreen(to); };
  const openCrt = (c) => { setOpenCourt(c); setPrevScreen(screen); setScreen('court'); };
  const openCol = (c) => { setOpenCollection(c); setPrevScreen(screen); setScreen('collection'); };
  const handleBack = () => { setScreen(prevScreen||'home'); setOpenCourt(null); setOpenCollection(null); };
  const handlePaywall = () => { setPrevScreen(screen); setScreen('paywall-fail'); };
  const handleUnlock = () => { setAccessState('full'); setScreen('paywall-success'); };

  // Demo stand-in for a real auth flow — same shortcut used in the mobile prototype
  const handleSignIn = () => setAccessState('free');

  // Which nav-pill item should read as active, even on a sub-screen
  const navActive = ['court','court-locked'].includes(screen) ? 'courts'
    : screen==='collection' ? 'collections'
    : ['saved','profile','settings'].includes(screen) ? 'profile'
    : screen;

  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',width:'100%'}}>
      {/* Top label */}
      <div style={{textAlign:'center',marginBottom:20}}>
        <span style={{fontSize:13,color:'#6B6B6B',background:'rgba(255,255,255,0.5)',padding:'4px 16px',borderRadius:100,border:'1px solid rgba(184,184,182,0.4)'}}>
          Tennis World — Desktop Design
        </span>
      </div>

      {/* Access-state switcher */}
      <div style={{display:'flex',gap:6,justifyContent:'center',marginBottom:14}}>
        {[['guest','Guest'],['free','Free User'],['full','Full Access']].map(([id,label])=>(
          <button key={id} onClick={()=>setAccessState(id)} style={{padding:'7px 18px',borderRadius:100,fontSize:12,fontWeight:accessState===id?600:400,background:accessState===id?'var(--clay)':'rgba(255,255,255,0.7)',color:accessState===id?'#fff':'#444',border:'1px solid rgba(184,184,182,0.5)',cursor:'pointer'}}>
            {label}
          </button>
        ))}
      </div>

      {/* Screen tabs */}
      <div style={{display:'flex',flexWrap:'wrap',gap:8,justifyContent:'center',marginBottom:24,maxWidth:760}}>
        {[
          ['home','Atlas'],['courts','Courts'],['collections','Collections'],['collection','Collection Detail'],['court','Court Detail'],['court-locked','Court Detail (Locked)'],
          ['saved','Saved'],['profile','Profile'],['settings','Settings'],
          ['paywall-success','Payment ✓'],['paywall-fail','Payment ✗'],
        ].map(([id,label])=>(
          <button key={id} onClick={()=>{setScreen(id);if(id==='court')setOpenCourt(COURTS.find(c=>!c.locked)||COURTS[0]);if(id==='court-locked')setOpenCourt(COURTS.find(c=>c.locked)||COURTS[1]);if(id==='collection'&&!openCollection)setOpenCollection(COLLECTIONS[0]);}} style={{padding:'6px 14px',borderRadius:100,fontSize:12,fontWeight:screen===id?600:400,background:screen===id?'#0F0F0F':'rgba(255,255,255,0.7)',color:screen===id?'#F5F2EC':'#444',border:'1px solid rgba(184,184,182,0.5)',cursor:'pointer'}}>
            {label}
          </button>
        ))}
      </div>

      <div className="browser-frame">
        <div className="browser-topbar">
          <div className="browser-dots">
            <span className="browser-dot" style={{background:'#E8605A'}}/>
            <span className="browser-dot" style={{background:'#E8B23B'}}/>
            <span className="browser-dot" style={{background:'#5DBB63'}}/>
          </div>
          <div className="browser-url">tennisworld.com{screen!=='home'?`/${screen}`:''}</div>
        </div>
        <div className="browser-frame-inner">
          <SiteNav active={navActive} onNav={navigate}/>
          {screen==='home'&&<HomeScreen onNav={navigate} onCourtOpen={openCrt} onUnlock={handlePaywall} unlocked={unlocked}/>}
          {screen==='courts'&&<CourtsScreen onNav={navigate} onCourtOpen={openCrt} unlocked={unlocked} isGuest={isGuest} onPaywall={handlePaywall}/>}
          {(screen==='court'||screen==='court-locked')&&<CourtDetailScreen court={openCourt||COURTS[0]} onBack={handleBack} unlocked={unlocked} onPaywall={handlePaywall}/>}
          {screen==='collections'&&<CollectionsScreen onNav={navigate} onCollectionOpen={openCol}/>}
          {screen==='collection'&&<CollectionDetailScreen collection={openCollection||COLLECTIONS[0]} onBack={handleBack} onNav={navigate} onCourtOpen={openCrt} unlocked={unlocked} onPaywall={handlePaywall}/>}
          {screen==='saved'&&<SavedScreen onNav={navigate} onCourtOpen={openCrt} isGuest={isGuest} onSignIn={handleSignIn}/>}
          {screen==='profile'&&<ProfileScreen onNav={navigate} unlocked={unlocked} isGuest={isGuest} onSignIn={handleSignIn} onUnlock={handlePaywall}/>}
          {screen==='settings'&&<SettingsScreen onBack={handleBack} unlocked={unlocked}/>}
          {screen==='paywall-success'&&<PurchaseSuccessScreen onBack={()=>setScreen(prevScreen||'home')}/>}
          {screen==='paywall-fail'&&<PurchaseFailedScreen onBack={()=>setScreen(prevScreen||'home')} onRetry={handleUnlock}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
