<style>
:root {
  --ink: #0F0F0F;
  --graphite: #2A2A2A;
  --stone: #6B6B6B;
  --mist: #B8B8B6;
  --bone: #F5F2EC;
  --ivory: #FAF8F3;
  --clay: #B95C3A;
  --moss: #4A5D3F;
  --gold: #B89968;
  --paper: #FFFFFF;
  --shadow: rgba(15,15,15,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:#E8E4DC;}
body{font-family:'Inter',-apple-system,sans-serif;color:var(--ink);background:#E8E4DC;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px 48px;}

/* Phone shell */
.phone{width:390px;min-height:844px;background:var(--bone);border-radius:48px;overflow:hidden;position:relative;box-shadow:0 32px 80px rgba(0,0,0,0.32),0 0 0 1px rgba(255,255,255,0.12);flex-shrink:0;}
.phone-inner{width:100%;min-height:844px;overflow-y:auto;overflow-x:hidden;position:relative;scroll-behavior:smooth;}
.phone-inner::-webkit-scrollbar{display:none;}

/* Status bar */
.status-bar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:relative;z-index:10;}
.status-time{font-size:15px;font-weight:600;color:var(--ink);}
.status-icons{display:flex;align-items:center;gap:6px;}
.status-bar.light .status-time,.status-bar.light .status-icons{color:#fff;}

/* Typography */
.serif{font-family:'Cormorant Garamond',Georgia,serif;}
.display-xl{font-family:'Cormorant Garamond',serif;font-size:44px;line-height:48px;font-weight:300;letter-spacing:-0.02em;}
.display-l{font-family:'Cormorant Garamond',serif;font-size:32px;line-height:38px;font-weight:300;letter-spacing:-0.02em;}
.display-m{font-family:'Cormorant Garamond',serif;font-size:24px;line-height:30px;font-weight:400;letter-spacing:-0.01em;}
.headline{font-size:20px;line-height:26px;font-weight:500;}
.body-l{font-size:17px;line-height:26px;font-weight:400;}
.body-m{font-size:15px;line-height:22px;font-weight:400;}
.body-s{font-size:13px;line-height:20px;font-weight:400;}
.caption{font-size:11px;line-height:16px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;}

/* Bottom nav — floating pill */
.bottom-nav{position:sticky;bottom:18px;margin:0 16px;background:rgba(250,248,243,0.78);backdrop-filter:blur(24px) saturate(1.5);-webkit-backdrop-filter:blur(24px) saturate(1.5);border:1px solid rgba(255,255,255,0.6);border-radius:100px;display:flex;align-items:center;padding:7px;gap:2px;z-index:100;box-shadow:0 16px 40px rgba(15,15,15,0.18),0 2px 10px rgba(15,15,15,0.08);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:7px 2px;border-radius:100px;transition:background 150ms;}
.nav-item.active{background:var(--ink);}
.nav-label{font-size:9.5px;font-weight:500;letter-spacing:0.02em;color:var(--stone);}
.nav-item.active .nav-label{color:var(--bone);}
.nav-icon{color:var(--stone);display:flex;align-items:center;justify-content:center;}
.nav-item.active .nav-icon{color:var(--bone);}

/* Search bar */
.search-bar{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:100px;padding:0 16px;height:48px;box-shadow:0 2px 12px rgba(15,15,15,0.1);}
.search-input{flex:1;border:none;outline:none;font-family:'Inter',sans-serif;font-size:15px;color:var(--ink);background:transparent;}
.search-input::placeholder{color:var(--stone);}

/* Label chips */
.label-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:100px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent;}
.chip-surface-clay{background:#F0E6E0;color:#8B3A1F;border-color:#D4A090;}
.chip-surface-hard{background:#E0E8F0;color:#1A4A70;border-color:#90B0C8;}
.chip-surface-grass{background:#E4EDE0;color:#2A5020;border-color:#90B878;}
.chip-surface-carpet{background:#EDE8E0;color:#504030;border-color:#B0A888;}
.chip-exp{background:rgba(15,15,15,0.06);color:var(--graphite);border-color:transparent;}
.chip-access-private{background:#F5F0E8;color:#6B4A20;border-color:#C8A878;}
.chip-access-open{background:#E8F5E8;color:#2A5020;border-color:#78B878;}
.chip-filter{background:var(--paper);color:var(--ink);border-color:rgba(15,15,15,0.15);cursor:pointer;}
.chip-filter.active{background:var(--ink);color:var(--bone);border-color:var(--ink);}

/* Court cards */
.court-card-horizontal{display:flex;gap:14px;background:var(--paper);padding:16px;cursor:pointer;}
.court-card-horizontal img{width:88px;height:88px;object-fit:cover;border-radius:8px;flex-shrink:0;}
.court-card-v{width:180px;flex-shrink:0;cursor:pointer;}
.court-card-v img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block;}
.court-card-full{background:var(--paper);cursor:pointer;}
.court-card-full img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;}

/* Image overlays */
.img-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,0.72) 100%);}
.img-overlay-top{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.5) 0%,rgba(0,0,0,0) 44%,rgba(0,0,0,0.78) 100%);}

/* Star rating */
.stars{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--stone);}
.star-filled{color:#C9963C;}

/* Section header */
.sec-hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
.sec-hdr .view-all{font-size:13px;color:var(--stone);cursor:pointer;}

/* Map styles */
.map-bg{
  background:
    linear-gradient(160deg,#C8D4C0 0%,#B8C8B0 50%,#A8B8A0 100%),
    radial-gradient(ellipse 60% 40% at 60% 45%,#A0B8C8 0%,transparent 60%);
  position:relative;overflow:hidden;
}
.map-pin{position:absolute;display:flex;flex-direction:column;align-items:center;cursor:pointer;}
.map-pin-circle{background:var(--paper);border:2px solid var(--ink);border-radius:100px;font-size:13px;font-weight:600;color:var(--ink);padding:4px 12px;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.map-pin-circle.active{background:var(--ink);color:var(--bone);}
.map-pin-dot{width:8px;height:8px;border-radius:50%;background:var(--ink);margin-top:2px;}
.map-pin-img{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--paper);box-shadow:0 2px 8px rgba(0,0,0,0.25);}
.map-pin-img img{width:100%;height:100%;object-fit:cover;}
.map-pin-dot-sm{width:6px;height:6px;border-radius:50%;background:var(--ink);margin-top:1px;}

/* Bottom sheet */
.bottom-sheet{background:var(--paper);border-radius:20px 20px 0 0;box-shadow:0 -4px 40px rgba(15,15,15,0.15);padding:12px 0 0;}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--mist);margin:0 auto 16px;}

/* Lock overlay */
.lock-overlay{position:absolute;inset:0;backdrop-filter:blur(16px);background:rgba(245,242,236,0.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:inherit;}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:0.04em;transition:opacity 150ms;}
.btn:hover{opacity:0.88;}
.btn:active{opacity:0.75;}
.btn-primary{background:var(--ink);color:var(--bone);border-radius:4px;height:52px;padding:0 24px;font-size:13px;text-transform:uppercase;letter-spacing:0.1em;}
.btn-secondary{background:transparent;color:var(--ink);border:1px solid var(--ink);border-radius:4px;height:52px;padding:0 24px;font-size:13px;text-transform:uppercase;letter-spacing:0.1em;}
.btn-gold{background:var(--gold);color:var(--paper);border-radius:4px;height:52px;padding:0 24px;font-size:13px;text-transform:uppercase;letter-spacing:0.1em;}
.btn-sm{height:40px;padding:0 16px;font-size:12px;}
.btn-pill{border-radius:100px;}

/* Icon shortcuts */
.icon-shortcut{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;min-width:64px;}
.icon-shortcut-circle{width:52px;height:52px;border-radius:50%;background:var(--paper);border:1px solid rgba(15,15,15,0.1);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px var(--shadow);}
.icon-shortcut-circle.active{background:var(--ink);border-color:var(--ink);}
.icon-shortcut-label{font-size:11px;color:var(--stone);text-align:center;font-weight:400;}
.icon-shortcut.active .icon-shortcut-label{color:var(--ink);}

/* Premium badge */
.premium-badge{background:linear-gradient(135deg,#C8A860,#B89968);color:var(--paper);padding:3px 10px;border-radius:100px;font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;display:inline-flex;align-items:center;gap:4px;}

/* Divider */
.divider{height:1px;background:rgba(184,184,182,0.3);margin:0 20px;}

/* Fade in */
.fade-in{animation:fadeIn 300ms ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Gallery strip */
.gallery-strip{display:flex;gap:8px;overflow-x:auto;padding:0 20px 2px;scrollbar-width:none;}
.gallery-strip::-webkit-scrollbar{display:none;}
.gallery-thumb{width:90px;height:72px;object-fit:cover;border-radius:8px;flex-shrink:0;}

/* Profile stats */
.profile-stat{text-align:center;}

/* Horizontal scroll row */
.h-scroll{display:flex;overflow-x:auto;gap:12px;scrollbar-width:none;padding-bottom:2px;}
.h-scroll::-webkit-scrollbar{display:none;}

/* Multi-phone layout */
.multi-phone{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;}

/* Country card */
.country-card{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;}
.country-card img{width:100%;height:100%;object-fit:cover;display:block;}

/* Nearby court card (small) */
.nearby-card{width:130px;flex-shrink:0;cursor:pointer;}
.nearby-card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block;}

/* Feature icon row */
.feature-row{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
.feature-icon{width:40px;height:40px;border-radius:50%;background:var(--bone);display:flex;align-items:center;justify-content:center;}

/* Saved card full width */
.saved-card-full{background:var(--paper);border-radius:12px;overflow:hidden;cursor:pointer;}
.saved-card-full img{width:100%;height:200px;object-fit:cover;display:block;}
</style>
</head>

// ─── Label chip component ──────────────────────────────────
function Label({type, children, small}){
  const cl = type==='clay'?'chip-surface-clay':type==='hard'?'chip-surface-hard':type==='grass'?'chip-surface-grass':type==='carpet'?'chip-surface-carpet':type==='private'?'chip-access-private':type==='open'?'chip-access-open':'chip-exp';
  return <span className={`label-chip ${cl}`} style={{fontSize:small?10:12,padding:small?'3px 8px':'5px 10px'}}>{children}</span>;
}

function SurfaceLabel({surface,small}){
  return <Label type={surface.toLowerCase()} small={small}>{surface}</Label>;
}

function Stars({rating, reviews}){
  return(
    <div className="stars">
      {Ico.star(14,true)}
      <span style={{color:'#C9963C',fontWeight:500}}>{rating}</span>
      {reviews && <span style={{color:'var(--stone)'}}>({reviews})</span>}
    </div>
  );
}

// ─── Status bar ───────────────────────────────────────────
// Browser-style top chrome — this is a website, not a native app, so the
// top of every screen is a solid, opaque bar (never see-through over imagery),
// imitating a browser address bar rather than a phone status bar.

  return(
    <div style={{position:'relative',height:44,flexShrink:0,background:'var(--paper)',borderBottom:'1px solid rgba(184,184,182,0.3)',display:'flex',alignItems:'center',justifyContent:'center',padding:'0 14px'}}>
      <div style={{position:'absolute',left:14,display:'flex',alignItems:'center',gap:12}}>
        {onBack ? (
          <button onClick={onBack} style={{background:'none',border:'none',cursor:'pointer',color:'var(--ink)',display:'flex',padding:4}}>{Ico.back(16)}</button>
        ) : (
          <>
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="var(--mist)" strokeWidth="2.6"><polyline points="15 18 9 12 15 6"/></svg>
            <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="var(--mist)" strokeWidth="2.6"><polyline points="9 18 15 12 9 6"/></svg>

}

// ─── Map screen ───────────────────────────────────────────────
function MapScreen({onNav, onCourtOpen, unlocked=true, isGuest=false, onPaywall}){
  const [query,setQuery] = useState('');
  const [activeFilters,setActiveFilters] = useState(new Set());
  const [showFilters,setShowFilters] = useState(false);
  const [mapOpen,setMapOpen] = useState(false);
  const [selected,setSelected] = useState(null);
  const [savedCourts,setSavedCourts] = useState(new Set());
  const openMap = () => { if(!isGuest) setMapOpen(true); };

  const filterOptions = ['Clay','Sea View','Resort'];
  const toggleFilter = (f) => setActiveFilters(prev=>{const n=new Set(prev); n.has(f)?n.delete(f):n.add(f); return n;});
  const matchesFilters = (c) => activeFilters.size===0 || [...activeFilters].every(f=>{
    if(f==='Clay') return c.surface==='Clay';
    if(f==='Sea View') return c.labels.includes('Sea View');
    if(f==='Resort') return c.labels.includes('Resort');
    return true;
  });

  const searchMatches = query.trim()
    ? COURTS.filter(c=>c.name.toLowerCase().includes(query.toLowerCase())||c.location.toLowerCase().includes(query.toLowerCase()))
    : [];
  const listCourts = COURTS.filter(matchesFilters);

  const pinPositions = [{x:'52%',y:'30%'},{x:'38%',y:'22%'},{x:'64%',y:'46%'},{x:'28%',y:'58%'},{x:'70%',y:'64%'},{x:'46%',y:'70%'},{x:'60%',y:'18%'},{x:'20%',y:'38%'}];

  return(
    <div style={{background:'var(--ivory)',minHeight:'100%'}}>
      <StatusBar path="courts"/>
      <TopTabs active="map" onNav={onNav}/>

      {/* Search */}
      <div style={{padding:'16px 20px 0'}}>
        <div className="search-bar">
          {Ico.search(16)}
          <input className="search-input" placeholder="Search courts, cities, countries" value={query} onChange={e=>setQuery(e.target.value)}/>
          {query&&<button onClick={()=>setQuery('')} style={{background:'none',border:'none',cursor:'pointer',color:'var(--stone)',display:'flex',padding:4}}>{Ico.close(14)}</button>}
          <button onClick={()=>setShowFilters(s=>!s)} style={{background:showFilters?'var(--ink)':'none',border:'none',borderRadius:'50%',width:28,height:28,cursor:'pointer',color:showFilters?'var(--bone)':'var(--stone)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,position:'relative'}}>
            {Ico.filter(15)}
            {activeFilters.size>0&&<span style={{position:'absolute',top:2,right:2,width:7,height:7,borderRadius:'50%',background:'var(--clay)',border:'1.5px solid var(--paper)'}}/>}
          </button>
        </div>
        {showFilters&&(
          <div className="h-scroll" style={{gap:8,marginTop:10}}>
            {filterOptions.map(f=>(
              <button key={f} className={`label-chip chip-filter ${activeFilters.has(f)?'active':''}`} onClick={()=>toggleFilter(f)}>{f}</button>
            ))}
          </div>
        )}
        {query.trim()&&(

// ─── Court card — the one true full horizontal court card, reused everywhere ───

  return(
    <div onClick={onClick} style={{position:'relative',borderRadius:14,overflow:'hidden',cursor:'pointer',height:170}}>
      <img src={court.img} style={{width:'100%',height:'100%',objectFit:'cover',display:'block'}}/>

          : <SurfaceLabel surface={court.surface} small/>
        }
      </div>
      {onToggleSave&&(
        <div style={{position:'absolute',top:10,right:10}}>
          <button onClick={e=>{e.stopPropagation(); if(saveDisabled){ setTipOpen(o=>!o); return; } onToggleSave();}} style={{width:32,height:32,borderRadius:'50%',background:'rgba(15,15,15,0.45)',backdropFilter:'blur(8px)',border:'none',cursor:saveDisabled?'not-allowed':'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:saveDisabled?'rgba(245,242,236,0.5)':(saved?'#E85D4A':'var(--bone)')}}>

            <div style={{position:'absolute',top:'115%',right:0,background:'var(--ink)',color:'var(--bone)',fontSize:11,fontWeight:500,padding:'6px 10px',borderRadius:6,whiteSpace:'nowrap',boxShadow:'0 6px 16px rgba(0,0,0,0.25)',zIndex:20}}>

      <div style={{position:'absolute',bottom:0,left:0,right:0,padding:'16px 14px 14px'}}>
        <div className="serif" style={{fontSize:19,fontWeight:400,color:'#fff',lineHeight:1.2,marginBottom:4}}>{locked?'Premium Court':court.name}</div>
        <div style={{display:'flex',gap:5,alignItems:'center',marginBottom:8,color:'rgba(255,255,255,0.85)'}}>

            <div key={s.label} onClick={s.active?()=>onNav('saved'):undefined} style={{display:'flex',flexDirection:'column',alignItems:'center',height:74,borderRight:i<stats.length-1?'1px solid rgba(184,184,182,0.3)':'none',opacity:s.active?1:0.45,cursor:s.active?'pointer':'default'}}>
              <div style={{color:'var(--ink)'}}>{s.icon(14)}</div>
              <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center'}}>
                {s.active
                  ? <span style={{fontSize:22,fontWeight:700}}>{s.n}</span>
                  : <span style={{fontSize:9,fontWeight:600,letterSpacing:'0.05em',textTransform:'uppercase',color:'var(--stone)',whiteSpace:'nowrap'}}>Coming soon</span>
                }
              </div>
              <div style={{fontSize:10,color:'var(--stone)'}}>{s.label}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Membership */}
      {!unlocked&&(
        <div style={{margin:'20px 20px 0',background:'var(--ink)',borderRadius:12,padding:'18px 16px',display:'flex',gap:12,alignItems:'center'}}>
          <div style={{flex:1}}>
            <div style={{fontSize:10,color:' var(--gold)',fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:4}}>Membership</div>
            <div className="serif" style={{fontSize:20,color:'var(--bone)',fontWeight:300}}>The world, unlocked.</div>
            <div style={{fontSize:12,color:'rgba(245,242,236,0.6)',marginTop:4}}>One-time · Lifetime · $29</div>
          </div>
          <button className="btn btn-gold btn-sm">Unlock →</button>
        </div>
      )}
      {unlocked&&(
        <div style={{margin:'20px 20px 0',background:'linear-gradient(135deg,#1A1A1A,#2A2A2A)',borderRadius:12,padding:'14px 16px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontSize:10,color:'var(--gold)',fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase'}}>Lifetime Member</div>
            <div style={{fontSize:13,color:'var(--bone)',marginTop:2}}>Full atlas access · Since 2024</div>
          </div>
          <span className="premium-badge">✦ Active</span>
        </div>
      )}

      {/* My collections — saved items, grouped (opens the Saved page) */}
      <div style={{padding:'24px 0 0'}}>
        <div className="sec-hdr" style={{padding:'0 20px',marginBottom:12,cursor:'pointer'}} onClick={()=>onNav('saved')}>
          <span style={{fontSize:16,fontWeight:600}}>My collections</span>
          <span className="view-all">View all →</span>
        </div>
        <div className="h-scroll" style={{padding:'0 20px',gap:12}}>
          {COLLECTIONS.slice(0,4).map(c=>(
            <div key={c.id} onClick={()=>onNav('saved')} style={{width:200,height:240,flexShrink:0,position:'relative',borderRadius:12,overflow:'hidden',cursor:'pointer'}}>
              <img src={c.img} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
              <div className="img-overlay"/>
              <div style={{position:'absolute',top:10,left:10}}>
                <span style={{background:'rgba(15,15,15,0.5)',backdropFilter:'blur(8px)',padding:'3px 10px',borderRadius:100,fontSize:9,color:'#fff',fontWeight:600,letterSpacing:'0.1em',textTransform:'uppercase'}}>{c.courts} COURTS</span>
              </div>
              <div style={{position:'absolute',bottom:0,left:0,right:0,padding:'16px 14px',display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
                <div>
                  <div className="serif" style={{fontSize:22,fontWeight:400,color:'#fff',lineHeight:1.15}}>{c.name}</div>
                  <div style={{fontSize:11,color:'rgba(255,255,255,0.7)',marginTop:4}}>{c.sub}</div>
                </div>
                <div style={{width:32,height:32,borderRadius:'50%',background:'rgba(255,255,255,0.2)',border:'1px solid rgba(255,255,255,0.5)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
                  {Ico.arrow(14)}
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div style={{height:40}}/>

      {/* Edit profile — modal (photo, name, email) */}
      {editOpen&&(
        <div style={{position:'fixed',top:0,bottom:0,left:'50%',width:390,maxWidth:'100vw',transform:'translateX(-50%)',zIndex:200,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
          <div style={{position:'absolute',inset:0,background:'rgba(15,15,15,0.4)'}} onClick={()=>setEditOpen(false)}/>
          <div style={{position:'relative',background:'var(--paper)',borderRadius:'20px 20px 0 0',padding:'20px 20px 32px',maxHeight:'85vh',overflowY:'auto'}}>
            <div style={{width:36,height:4,background:'var(--mist)',borderRadius:2,margin:'0 auto 20px'}}/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24}}>
              <span style={{fontSize:17,fontWeight:600}}>Edit profile</span>
              <button onClick={()=>setEditOpen(false)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--stone)'}}>{Ico.close(18)}</button>
            </div>

            {/* Photo */}
            <div style={{display:'flex',justifyContent:'center',marginBottom:24}}>
              <div style={{position:'relative'}}>
                <div style={{width:88,height:88,borderRadius:'50%',overflow:'hidden',border:'3px solid var(--bone)',boxShadow:'0 2px 12px rgba(15,15,15,0.15)'}}>
                  <img src={draftAvatar} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                </div>
                <button onClick={()=>setDraftAvatar(a=>AVATARS[(AVATARS.indexOf(a)+1)%AVATARS.length])} style={{position:'absolute',bottom:-2,right:-2,width:28,height:28,borderRadius:'50%',background:'var(--ink)',border:'2px solid var(--paper)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'var(--bone)'}}>
                  {Ico.img(13)}
                </button>
              </div>
            </div>

            {/* Name */}
            <div style={{marginBottom:16}}>
              <label style={{fontSize:11,fontWeight:600,letterSpacing:'0.06em',color:'var(--stone)',textTransform:'uppercase',display:'block',marginBottom:6}}>Name</label>
              <input value={draftName} onChange={e=>setDraftName(e.target.value)} style={{width:'100%',height:48,padding:'0 14px',borderRadius:8,border:'1px solid rgba(184,184,182,0.4)',fontSize:15,fontFamily:"'Inter',sans-serif",color:'var(--ink)',outline:'none',background:'var(--bone)'}}/>
            </div>

            {/* Email */}
            <div style={{marginBottom:24}}>
              <label style={{fontSize:11,fontWeight:600,letterSpacing:'0.06em',color:'var(--stone)',textTransform:'uppercase',display:'block',marginBottom:6}}>Email</label>
              <input type="email" value={draftEmail} onChange={e=>setDraftEmail(e.target.value)} style={{width:'100%',height:48,padding:'0 14px',borderRadius:8,border:'1px solid rgba(184,184,182,0.4)',fontSize:15,fontFamily:"'Inter',sans-serif",color:'var(--ink)',outline:'none',background:'var(--bone)'}}/>
            </div>

            <button className="btn btn-primary" style={{width:'100%'}} onClick={saveEdit}>Save changes</button>
          </div>
        </div>
      )}
    </div>
  );
}

}

      <StatusBar/>
      {/* Hero image */}
      <div style={{position:'relative',height:280}}>
        <img src={U(IMG.paywall,800)} style={{width:'100%',height:'100%',objectFit:'cover'}}/>

// ─── Root app ─────────────────────────────────────────────
function App(){
  const [screen,setScreen]=useState('home');
  const [prevScreen,setPrevScreen]=useState(null);
  const [openCourt,setOpenCourt]=useState(null);
  const [openCollection,setOpenCollection]=useState(null);
  const [accessState,setAccessState]=useState('guest'); // 'guest' | 'free' | 'full'
  const unlocked = accessState==='full';
  const isGuest = accessState==='guest';

  const navigate = (to) => {
    setPrevScreen(screen);
    setScreen(to);
  };

  const openCrt = (c) => {
    setOpenCourt(c);
    setPrevScreen(screen);
    setScreen('court');
  };

  const openCol = (c) => {
    setOpenCollection(c);
    setPrevScreen(screen);
    setScreen('collection');
  };

  const handleBack = () => {
    setScreen(prevScreen||'home');
    setOpenCourt(null);
    setOpenCollection(null);
  };

  const handlePaywall = () => {
    setPrevScreen(screen);
    setScreen('paywall-fail');
  };

  const handleUnlock = () => {
    setAccessState('full');
    setScreen('paywall-success');
  };

  // Demo stand-in for a real auth flow — simulates a guest signing in/up
  const handleSignIn = () => {
    setAccessState('free');
  };

  return(
    <div>
      {/* Top label */}
      <div style={{textAlign:'center',marginBottom:20}}>
        <span style={{fontSize:13,color:'#6B6B6B',background:'rgba(255,255,255,0.5)',padding:'4px 16px',borderRadius:100,border:'1px solid rgba(184,184,182,0.4)'}}>
          Tennis World — Mobile Design
        </span>
      </div>

      {/* Access-state switcher — persistent across every screen tab */}
      <div style={{display:'flex',gap:6,justifyContent:'center',marginBottom:14}}>
        {[['guest','Guest'],['free','Free User'],['full','Full Access']].map(([id,label])=>(
          <button key={id} onClick={()=>setAccessState(id)} style={{padding:'7px 18px',borderRadius:100,fontSize:12,fontWeight:accessState===id?600:400,background:accessState===id?'var(--clay)':'rgba(255,255,255,0.7)',color:accessState===id?'#fff':'#444',border:'1px solid rgba(184,184,182,0.5)',cursor:'pointer'}}>
            {label}
          </button>
        ))}
      </div>

      {/* Screen tabs */}
      <div style={{display:'flex',flexWrap:'wrap',gap:8,justifyContent:'center',marginBottom:24}}>
        {[
          ['home','Atlas'],['map','Courts'],['collections','Collections'],['collection','Collection Detail'],['court','Court Detail'],['court-locked','Court Detail (Locked)'],
          ['saved','Saved'],['profile','Profile'],['settings','Settings'],
          ['paywall-success','Payment ✓'],['paywall-fail','Payment ✗'],
        ].map(([id,label])=>(
          <button key={id} onClick={()=>{setScreen(id);if(id==='court')setOpenCourt(COURTS.find(c=>!c.locked)||COURTS[0]);if(id==='court-locked')setOpenCourt(COURTS.find(c=>c.locked)||COURTS[1]);if(id==='collection'&&!openCollection)setOpenCollection(COLLECTIONS[0]);}} style={{padding:'6px 14px',borderRadius:100,fontSize:12,fontWeight:screen===id?600:400,background:screen===id?'#0F0F0F':'rgba(255,255,255,0.7)',color:screen===id?'#F5F2EC':'#444',border:'1px solid rgba(184,184,182,0.5)',cursor:'pointer'}}>
            {label}
          </button>
        ))}
      </div>

      <div style={{display:'flex',justifyContent:'center'}}>
        <div className="phone">
          <div className="phone-inner">
            {screen==='home'&&<HomeScreen onNav={navigate} onCourtOpen={openCrt} onPaywall={handlePaywall} unlocked={unlocked}/>}
            {screen==='map'&&<MapScreen onNav={navigate} onCourtOpen={openCrt} unlocked={unlocked} isGuest={isGuest} onPaywall={handlePaywall}/>}
            {(screen==='court'||screen==='court-locked')&&<CourtDetailScreen court={openCourt||COURTS[0]} onBack={handleBack} onNav={navigate} unlocked={unlocked} onPaywall={handlePaywall}/>}
            {screen==='collections'&&<CollectionsScreen onNav={navigate} onCollectionOpen={openCol}/>}
            {screen==='collection'&&<CollectionDetailScreen collection={openCollection||COLLECTIONS[0]} onBack={handleBack} onNav={navigate} onCourtOpen={openCrt} unlocked={unlocked} onPaywall={handlePaywall}/>}
            {screen==='saved'&&<SavedScreen onNav={navigate} onCourtOpen={openCrt} isGuest={isGuest} onSignIn={handleSignIn}/>}
            {screen==='profile'&&<ProfileScreen onNav={navigate} unlocked={unlocked} isGuest={isGuest} onSignIn={handleSignIn}/>}
            {screen==='settings'&&<SettingsScreen onBack={handleBack} unlocked={unlocked}/>}
            {screen==='paywall-success'&&<PurchaseSuccessScreen onBack={()=>setScreen(prevScreen||'home')} returnTo={prevScreen}/>}
            {screen==='paywall-fail'&&<PurchaseFailedScreen onBack={()=>setScreen(prevScreen||'home')} onRetry={handleUnlock}/>}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
